# One-time offline migration only. Stop the database before running this Job.
# This intentionally refuses to overwrite a non-empty destination.
apiVersion: batch/v1
kind: Job
metadata:
  name: cockroachdb-migrate-to-host
  namespace: cockroach
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: aks-main-11118102-vmss000001
      containers:
        - name: copy
          image: cockroachdb/cockroach:v26.2.7
          command: [/bin/sh, -ec]
          args:
            - |
              test -n "$(ls -A /source)"
              test -z "$(ls -A /destination)"
              cp -a /source/. /destination/
              sync
              test -n "$(ls -A /destination)"
              echo 'Offline store copied successfully'
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: data-cockroachdb-0
        - name: destination
          hostPath:
            path: /var/lib/cockroachdb/cockroach
            type: DirectoryOrCreate
