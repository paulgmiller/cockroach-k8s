# Source: cockroachdb-chart/templates/service.public.yaml
# This Service is meant to be used by clients of the database.
# It exposes a ClusterIP that will automatically load balance connections
# to the different database Pods.
kind: Service
apiVersion: v1
metadata:
  name: cockroachdb-secure-public
  namespace: "cockroach"
  labels:
    helm.sh/chart: cockroachdb-26.2.4
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: "cockroachdb-secure"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/component: cockroachdb
  annotations:
    service.alpha.kubernetes.io/app-protocols: '{"http":"HTTPS"}'
spec:
  selector:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: "cockroachdb-secure"
    app: cockroachdb
    app.kubernetes.io/component: cockroachdb
  # Cockroach Cloud operator doesn't provide a way to change the sql,grpc and http ports for the pods. Hence, making these
  # ports static here.
  type: "ClusterIP"
  ports:
    # The main port, served by gRPC, serves Postgres-flavor SQL, inter-node
    # traffic and the CLI.
    - name: "grpc"
      port: 26258
      targetPort: grpc
    - name: "sql"
      port: 26257
      targetPort: sql
    # The secondary port serves the UI as well as health and debug endpoints.
    - name: "http"
      port: 8080
      targetPort: http

