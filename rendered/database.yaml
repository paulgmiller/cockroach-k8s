# Source: cockroachdb-chart/templates/job-certSelfSigner.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: cockroachdb-secure-self-signer
  namespace: "cockroach"
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
  labels:
    helm.sh/chart: cockroachdb-26.2.4
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: "cockroachdb-secure"
    app.kubernetes.io/managed-by: "Helm"
spec:
  template:
    metadata:
      name: cockroachdb-secure-self-signer
      labels:
        helm.sh/chart: cockroachdb-26.2.4
        app.kubernetes.io/name: cockroachdb
        app.kubernetes.io/instance: "cockroachdb-secure"
        app.kubernetes.io/managed-by: "Helm"
    spec:
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsGroup: 1000
        runAsUser: 1000
        fsGroup: 1000
        runAsNonRoot: true
      restartPolicy: Never
      containers:
        - name: cert-generate-job
          image: "docker.io/cockroachdb/cockroach-self-signer-cert:1.10"
          imagePullPolicy: "IfNotPresent"
          args:
            - generate
            - --ca-duration=43800h
            - --ca-expiry=648h
            - --client-duration=672h
            - --client-expiry=48h
            - --node-duration=8760h
            - --node-expiry=168h
            - --operator-managed=true
          env:
            - name: STATEFULSET_NAME
              value: cockroachdb-secure
            - name: NAMESPACE
              value: "cockroach"
            - name: CLUSTER_DOMAIN
              value: cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      serviceAccountName: cockroachdb-secure-self-signer

