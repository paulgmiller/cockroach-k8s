# Source: cockroachdb-chart/templates/crdb.yaml
apiVersion: crdb.cockroachlabs.com/v1beta1
kind: CrdbCluster
metadata:
  name: cockroachdb-secure
  namespace: cockroach
  labels:
    helm.sh/chart: cockroachdb-26.2.4
    app.kubernetes.io/name: cockroachdb-secure-cockroach
    app.kubernetes.io/instance: cockroachdb-secure
    app.kubernetes.io/version: "26.2.5"
    app.kubernetes.io/managed-by: Helm
    app: cockroachdb
    app.kubernetes.io/component: cockroachdb
spec:
  tlsEnabled: true
  mode: "MutableOnly"
  postInitSQL:
    secretRef:
      key: init.sql
      name: cockroachdb-root
  regions:
    - cloudProvider: azure
      code: westus3
      namespace: cockroach
      nodes: 3
  rollingRestartDelay: 30s
  template:
    spec:
      image: "cockroachdb/cockroach:v26.2.7"
      certificates:
        externalCertificates:
          caConfigMapName: cockroachdb-secure-ca-secret-crt
          httpSecretName: cockroachdb-secure-client-secret
          nodeSecretName: cockroachdb-secure-node-secret
          rootSqlClientSecretName: cockroachdb-secure-client-secret
      dataStore:
        volumeClaimTemplate:
          metadata: {}
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: managed-csi-zrs
            volumeMode: Filesystem
      sideCars:
        containers: []
        initContainers: []
        volumes: []
      grpcPort: 26258
      sqlPort: 26257
      httpPort: 8080
      startFlags:
        upsert:
        - --cache=128MiB
        - --max-sql-memory=128MiB
        - --max-disk-temp-storage=1GiB
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: cockroachdb
            app.kubernetes.io/instance: "cockroachdb-secure"
            app: cockroachdb
            app.kubernetes.io/component: cockroachdb
          annotations:
            helm.sh/restartedAt: "2021-10-18T00:00:00Z"
        spec:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: cockroachdb
                    topologyKey: kubernetes.io/hostname
                  weight: 100
            containers:
            - name: cockroachdb
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: 250m
                  memory: 512Mi
            nodeSelector:
              kubernetes.io/os: linux
            serviceAccountName: cockroachdb-secure
            topologySpreadConstraints: []
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
