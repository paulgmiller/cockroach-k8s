# Source: cockroachdb-chart/templates/cronjob-ca-certSelfSigner.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cockroachdb-secure-rotate-self-signer
  namespace: "cockroach"
  labels:
    helm.sh/chart: cockroachdb-26.2.4
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: "cockroachdb-secure"
    app.kubernetes.io/managed-by: "Helm"
spec:
  schedule: 0 0 1 */11 *
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
        spec:
          restartPolicy: Never
          containers:
            - name: cert-rotate-job
              image: "docker.io/cockroachdb/cockroach-self-signer-cert:1.10"
              imagePullPolicy: "IfNotPresent"
              args:
                - rotate
                - --ca
                - --ca-duration=43800h
                - --ca-expiry=648h
                - --ca-cron=0 0 1 */11 *
                - --readiness-wait=30s
                - --pod-update-timeout=2m
              env:
                - name: STATEFULSET_NAME
                  value: cockroachdb-secure
                - name: NAMESPACE
                  value: cockroach
                - name: CLUSTER_DOMAIN
                  value: cluster.local
          serviceAccountName: cockroachdb-secure-rotate-self-signer

