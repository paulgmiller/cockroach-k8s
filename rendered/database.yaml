# Source: cockroachdb-chart/templates/tests/client.yaml
kind: Pod
apiVersion: v1
metadata:
  name: cockroachdb-secure-test
  namespace: "cockroach"
  annotations:
    helm.sh/hook: test-success
spec:
  restartPolicy: Never
  volumes:
    - name: client-certs
      secret:
        secretName: cockroachdb-root
        defaultMode: 0400
  containers:
    - name: client-test
      image: "cockroachdb/cockroach:v26.2.7"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
      - name: client-certs
        mountPath: /cockroach-certs
      command:
        - /cockroach/cockroach
        - sql
        - --certs-dir
        - /cockroach-certs
        - --host
        - cockroachdb-secure-public.cockroach
        - --port
        - "26258"
        - -e
        - SHOW DATABASES;

