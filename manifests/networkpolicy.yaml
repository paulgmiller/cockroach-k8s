apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cockroachdb-ingress
  namespace: cockroach
spec:
  podSelector:
    matchLabels:
      app: cockroachdb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 26257
        - protocol: TCP
          port: 26258
        - protocol: TCP
          port: 8080
    # Application namespaces need SQL access only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aggrovites
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: horsebets
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lunch
      ports:
        - protocol: TCP
          port: 26257
    # Allow controller RPC/health traffic to operator-managed database pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cockroach-operator-system
