apiVersion: v1
kind: Namespace
metadata:
  name: cockroach-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cockroach-local-path-sa
  namespace: cockroach-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cockroach-local-path-role
  namespace: cockroach-storage
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cockroach-local-path-role
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - persistentvolumeclaims
  - configmaps
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cockroach-local-path-bind
  namespace: cockroach-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cockroach-local-path-role
subjects:
- kind: ServiceAccount
  name: cockroach-local-path-sa
  namespace: cockroach-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cockroach-local-path-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cockroach-local-path-role
subjects:
- kind: ServiceAccount
  name: cockroach-local-path-sa
  namespace: cockroach-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: cockroach-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: cockroach-local-path-sa
      containers:
      - name: local-path-provisioner
        image: docker.io/rancher/local-path-provisioner:v0.0.37
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - --debug
        - start
        - --config
        - /etc/config/config.json
        - --provisioner-name
        - cockroach.local/local-path
        - --service-account-name
        - cockroach-local-path-sa
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_MOUNT_PATH
          value: /etc/config/
        - name: HEALTH_PORT
          value: '8080'
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config-volume
        configMap:
          name: local-path-config
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: cockroach-storage
data:
  config.json: "{\n  \"nodePathMap\": [],\n  \"storageClassConfigs\": {\n    \"cockroach-local-auto\"\
    : {\n      \"nodePathMap\": [\n        {\n          \"node\": \"DEFAULT_PATH_FOR_NON_LISTED_NODES\"\
    ,\n          \"paths\": [\n            \"/var/lib/cockroachdb/volumes\"\n    \
    \      ]\n        }\n      ]\n    }\n  }\n}"
  setup: '#!/bin/sh

    set -eu

    mkdir -m 0700 -p "$VOL_DIR"

    '
  teardown: '#!/bin/sh

    set -eu

    rm -rf "$VOL_DIR"'
  helperPod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: helper-pod\nspec:\n\
    \  priorityClassName: system-node-critical\n  tolerations:\n  - key: node.kubernetes.io/disk-pressure\n\
    \    operator: Exists\n    effect: NoSchedule\n  containers:\n  - name: helper-pod\n\
    \    image: docker.io/library/busybox:1.37.0\n    imagePullPolicy: IfNotPresent\n"
