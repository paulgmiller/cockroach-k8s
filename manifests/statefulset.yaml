apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: cockroach
spec:
  serviceName: cockroachdb-headless
  replicas: 1
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
    spec:
      nodeSelector:
        kubernetes.io/hostname: aks-main-11118102-vmss000001
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: cockroachdb
          image: cockroachdb/cockroach:v26.2.7
          imagePullPolicy: IfNotPresent
          command: [/cockroach/cockroach]
          args:
            - start-single-node
            - --insecure
            - --listen-addr=0.0.0.0:26257
            - --http-addr=0.0.0.0:8080
            - --store=/cockroach/cockroach-data
            - --cache=128MiB
            - --max-sql-memory=128MiB
            - --max-disk-temp-storage=1GiB
          ports:
            - name: sql
              containerPort: 26257
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health?ready=1
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /cockroach/cockroach-data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/cockroachdb/cockroach
            type: DirectoryOrCreate
