apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: cockroach
spec:
  serviceName: cockroachdb-headless
  replicas: 1
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cockroachdb
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cockroachdb
          image: cockroachdb/cockroach:v26.2.7
          imagePullPolicy: IfNotPresent
          command: [/cockroach/cockroach]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - start
            - --insecure
            - --listen-addr=0.0.0.0:26257
            - --http-addr=0.0.0.0:8080
            - --advertise-addr=$(POD_NAME).cockroachdb-headless.cockroach.svc.cluster.local:26257
            - --join=cockroachdb-0.cockroachdb-headless.cockroach.svc.cluster.local:26257,cockroachdb-1.cockroachdb-headless.cockroach.svc.cluster.local:26257,cockroachdb-2.cockroachdb-headless.cockroach.svc.cluster.local:26257
            - --store=/cockroach/cockroach-data
            - --cache=128MiB
            - --max-sql-memory=128MiB
            - --max-disk-temp-storage=1GiB
          ports:
            - name: sql
              containerPort: 26257
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: local-data
              mountPath: /cockroach/cockroach-data
  volumeClaimTemplates:
    - metadata:
        name: local-data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        storageClassName: cockroach-local-auto
        resources:
          requests:
            storage: 10Gi
